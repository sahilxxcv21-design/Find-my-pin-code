<title>Find My Pin Code</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#111}
.wrap{max-width:820px;margin:auto;padding:16px}.hero{background:#111;color:#fff;border-radius:24px;padding:25px 18px;text-align:center}
h1{margin:0;font-size:31px}.sub{color:#cfcfcf;margin:8px 0 0}.creator{margin:16px auto 0;display:flex;align-items:center;justify-content:center;gap:12px}
.creator-photo{width:58px;height:58px;border-radius:50%;object-fit:cover;object-position:center;display:block;border:2px solid #fff}
.creator-text{text-align:left;font-size:14px;line-height:1.25;color:#fff}
.creator-text strong{font-size:17px}
.search{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
input{flex:1;min-width:190px;padding:15px;border:0;border-radius:12px;font-size:17px;outline:none}
button{padding:15px 20px;border:0;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
#status{margin:17px 2px;color:#555;font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:11px}
.card{background:white;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0001}.name{font-size:19px;font-weight:700}
.meta{color:#666;line-height:1.6;margin-top:7px}.badge{display:inline-block;background:#eee;border-radius:20px;padding:5px 10px;margin-top:10px;font-size:12px}
.error{background:#fff0f0;border-radius:14px;padding:14px;color:#8b2222}.hint{color:#777;font-size:13px;text-align:center;margin:22px 0}
</style>

<div class="search">
<input id="pin" inputmode="numeric" maxlength="6" placeholder="Enter Indian PIN code e.g. 193411">
<button id="find">Find My Pin Code</button>
</div>
</section>
<div id="status">Enter a 6-digit Indian PIN code.</div>
<div id="results" class="grid"></div>
<p class="hint">Live postal lookup • India</p>
</div>

<script>
const $=x=>document.getElementById(x);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

async function getJson(url,ms=10000){
 const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
 try{
   const r=await fetch(url,{method:'GET',headers:{'Accept':'application/json'},cache:'no-store',signal:c.signal});
   if(!r.ok) throw new Error('HTTP '+r.status);
   const d=await r.json(); return d;
 }finally{clearTimeout(t)}
}

function renderIndia(rows,pin,source){
 const box=$('results'); box.innerHTML='';
 rows.forEach(p=>{
   box.insertAdjacentHTML('beforeend',`<article class="card">
   <div class="name">${esc(p.name||p.office_name||'Unknown')}</div>
   <div class="meta">
   District: ${esc(p.district||'—')}<br>
   State: ${esc(p.state||'—')}<br>
   Division: ${esc(p.division||'—')}<br>
   Region: ${esc(p.region||'—')}<br>
   Circle: ${esc(p.circle||'—')}<br>
   Delivery: ${esc(p.delivery||p.delivery_status||'—')}<br>
   Office type: ${esc(p.type||p.office_type||'—')}
   </div><span class="badge">${esc(pincodeValue(p,pin))}</span>
   </article>`);
 });
 $('status').textContent=`${rows.length} matching postal location(s) found for PIN ${pin}`;
}

function pincodeValue(p,pin){return p.pincode||p.Pincode||pin}

async function findPin(){
 const pin=$('pin').value.trim(), box=$('results'), status=$('status');
 box.innerHTML='';
 if(!/^[0-9]{6}$/.test(pin)){status.textContent='Please enter exactly 6 digits.';return}
 status.textContent='Searching live postal data…';
 $('find').disabled=true;

 try{
   // Primary source
   const d=await getJson('https://api.postalpincode.in/pincode/'+pin);
   const x=d?.[0];
   if(x?.Status==='Success' && Array.isArray(x.PostOffice) && x.PostOffice.length){
     renderIndia(x.PostOffice.map(p=>({
       name:p.Name,district:p.District,state:p.State,division:p.Division,
       region:p.Region,circle:p.Circle,delivery:p.DeliveryStatus,type:p.BranchType,pincode:p.Pincode
     })),pin,'India Post PIN service');
     return;
   }
   throw new Error('Primary source returned no record');
 }catch(primary){
   try{
     // Fallback source with the current V1 endpoint.
     const d=await getJson('https://api.pincodeapi.in/v1/pincode/'+pin);
     const rows=d?.data?.post_offices;
     if(Array.isArray(rows)&&rows.length){renderIndia(rows,pin,'fallback');return}
     throw new Error('Fallback returned no record');
   }catch(fallback){
     status.textContent='No result found or the live postal service is temporarily unavailable.';
     box.innerHTML='<div class="error"><b>Search failed.</b><br>Check the PIN code and internet connection, then press the button again.</div>';
   }
 }finally{$('find').disabled=false}
}
$('find').onclick=findPin;
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')findPin()});
</script>

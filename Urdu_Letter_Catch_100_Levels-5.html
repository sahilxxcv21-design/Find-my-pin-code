<div id="stats">لیول 1 | حروف: 0 / 8</div>
<div id="livesHud">لائف لائن: <span id="lifeCount">5</span></div>
<canvas id="game"></canvas>

<div id="panel">
<h1>اردو حروف پکڑو</h1>
<p id="intro">پہلے آسان لیول، پھر آہستہ آہستہ مشکل۔<br>100 لیول مکمل کریں!</p>
<button id="play">شروع کریں</button>
<button id="select">لیول منتخب کریں</button>
</div>

<div id="levels">
<h1>100 لیول</h1>
<div id="levelTitle">اپنا لیول منتخب کریں</div>
<div id="levelGrid"></div>
<br><button id="closeLevels">واپس</button>
</div>

<script>
const letters=[..."ابتثجحخدذرڑزژسشصضطظعغفقکگلمنوہءیے"];
const c=document.getElementById('game'),ctx=c.getContext('2d');
const panel=document.getElementById('panel'),levelsBox=document.getElementById('levels');
let W,H,dpr,player,items,score,running=false,last=0,spawn=0,targetX=0;
let level=1, unlocked=+localStorage.urduUnlocked||1, completed=JSON.parse(localStorage.urduDone||"[]"), lives=5;
let lastShownScore=-1;

function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

function goalFor(l){return Math.min(8+Math.floor(l*.7),55)}
function speedFor(l){return 90+l*5}
function spawnTime(l){return Math.max(.18,.75-l*.0055)}
function start(l=level){
 level=l;score=0;lastShownScore=-1;items=[];player={x:W/2-48,y:H-78,w:96,h:30};targetX=W/2;
 running=true;panel.style.display='none';levelsBox.style.display='none';
 updateStats();last=performance.now();spawn=0;requestAnimationFrame(loop)
}
function updateStats(){
 document.getElementById('stats').textContent='لیول '+level+' | حروف: '+score+' / '+goalFor(level);
 document.getElementById('lifeCount').textContent=lives;
}
document.getElementById('play').onclick=()=>start(level);
document.getElementById('select').onclick=showLevels;
document.getElementById('closeLevels').onclick=()=>{levelsBox.style.display='none';panel.style.display='flex'};

function showLevels(){
 panel.style.display='none';levelsBox.style.display='block';
 const grid=document.getElementById('levelGrid');grid.innerHTML='';
 for(let i=1;i<=100;i++){
  const b=document.createElement('button');b.className='level '+(i<=unlocked?'':'lock')+(completed.includes(i)?' done':'');
  b.textContent=i<=unlocked?i:'🔒';
  b.onclick=()=>{if(i<=unlocked)start(i)};
  grid.appendChild(b);
 }
}
function move(e){targetX=e.clientX}
c.addEventListener('pointermove',move);c.addEventListener('pointerdown',move);

function spawnLetter(){
 let ch=letters[Math.floor(Math.random()*letters.length)];
 items.push({ch:ch,x:25+Math.random()*(W-50),y:-25,v:speedFor(level)+Math.random()*70,caught:false})
}
function loop(t){
 if(!running)return;
 let dt=Math.min(.035,(t-last)/1000);last=t;
 spawn-=dt;if(spawn<=0){spawn=spawnTime(level);spawnLetter()}
 player.x+=(targetX-player.x)*Math.min(1,dt*(9+level*.025));
 player.x=Math.max(0,Math.min(W-player.w,player.x));

 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#174c2c');g.addColorStop(1,'#031008');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,.5)';
 for(let i=0;i<24;i++)ctx.fillRect((i*137)%W,(i*83+level*8)%H,1.5,1.5);

 for(const it of items){
  it.y+=it.v*dt;ctx.font='bold 38px serif';ctx.textAlign='center';ctx.fillStyle='#fff';
  ctx.fillText(it.ch,it.x,it.y);
  if(it.y>player.y-25&&it.y<player.y+30&&it.x>player.x-10&&it.x<player.x+player.w+10){
   score++;it.caught=true;it.y=H+100;
  }
 }
 let missedNow=0;
 items=items.filter(it=>{
   if(it.y>=H+60){
     if(!it.caught) missedNow++;
     return false;
   }
   return true;
 });
 if(missedNow>0){
   lives=Math.max(0,lives-missedNow);
   updateStats();
   if(lives===0){gameOver();return}
 }
 const tray=ctx.createLinearGradient(player.x,player.y,player.x,player.y+player.h);
 tray.addColorStop(0,'#35d6ff');tray.addColorStop(0.5,'#1476d4');tray.addColorStop(1,'#0a3f91');
 ctx.fillStyle=tray;ctx.beginPath();ctx.roundRect(player.x,player.y,player.w,player.h,13);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.roundRect(player.x+10,player.y+6,player.w-20,4,3);ctx.fill();
 updateStats();

 if(score>=goalFor(level)){winLevel();return}
 requestAnimationFrame(loop)
}
function gameOver(){
 running=false;
 panel.innerHTML='<h1>💔 گیم اوور</h1><p>آپ کی پانچوں لائف ختم ہوگئیں۔<br>اس لیول کا اسکور: '+score+'</p><button id="retry">دوبارہ کھیلیں</button><button id="menu">لیولز دیکھیں</button>';
 panel.style.display='flex';
 document.getElementById('retry').onclick=()=>start(level);
 document.getElementById('menu').onclick=showLevels;
}
function winLevel(){
 running=false;
 if(!completed.includes(level))completed.push(level);
 if(level>=unlocked && unlocked<100)unlocked=level+1;
 localStorage.urduUnlocked=unlocked;localStorage.urduDone=JSON.stringify(completed);
 panel.innerHTML='<h1>🎉 لیول مکمل!</h1><p>آپ نے لیول '+level+' جیت لیا۔</p><button id="next">'+
 (level<100?'اگلا لیول':'100 لیول مکمل!')+'</button><button id="menu">لیولز دیکھیں</button>';
